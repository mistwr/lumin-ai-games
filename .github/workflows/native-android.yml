name: Native Android APK
on:
  workflow_dispatch:
  push:
    branches: [feature/native-lumin-games]
    paths: ['native/**', '.github/workflows/native-android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native debug APK
        working-directory: native
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all
      - uses: actions/upload-artifact@v4
        with:
          name: lumin-games-native-debug
          path: native/app/build/outputs/apk/debug/app-debug.apk
